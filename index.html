<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saafir's Stealth Portal</title>
    <style>
        :root { --bg: #050505; --panel: #111; --accent: #00ff88; --text: #fff; }
        body, html { background: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        
        .header {
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border-bottom: 2px solid var(--accent);
            gap: 10px;
        }

        .btn-group { display: flex; gap: 10px; }
        
        .btn {
            background: var(--accent);
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .window-container { height: calc(100% - 100px); width: 100%; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <div style="color: var(--accent); font-size: 12px; font-weight: bold;">RESTRICTION BYPASS ACTIVE</div>
        <div class="btn-group">
            <button class="btn" onclick="openProxied('https://www.youtube.com')">Launch YouTube</button>
            <button class="btn" style="background:#333; color:white;" onclick="openProxied('https://www.google.com')">Unblocked Google</button>
        </div>
    </div>

    <div class="window-container">
        <iframe 
            id="proxyFrame"
            src="about:blank" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const frame = document.getElementById('proxyFrame');

        function openProxied(targetUrl) {
            // We use CroxyProxy's public endpoint to wrap the site
            // This hides the 'youtube.com' domain from your iPad's filters
            const proxyUrl = "https://www.croxyproxy.com/_9/re_5/" + encodeURIComponent(targetUrl);
            frame.src = proxyUrl;
        }
    </script>
</body>
</html>
