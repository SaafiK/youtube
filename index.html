<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAAFIR_OS | Media Pipe</title>
    <style>
        :root { --bg: #000; --accent: #39FF14; --panel: #111; }
        body, html { background: var(--bg); color: white; margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        
        .header {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border-bottom: 2px solid var(--accent);
            padding: 0 15px;
            gap: 10px;
        }

        input {
            flex: 1;
            max-width: 450px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: #000;
            color: var(--accent);
            font-size: 16px; /* Blocks iPad keyboard zoom loop */
        }

        .btn {
            padding: 12px 20px;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        /* The 'Ghost' Window that kills the session when closed */
        #ghostWindow {
            position: fixed;
            top: 92px;
            left: 0;
            width: 100%;
            height: calc(100% - 92px);
            background: #000;
            display: none;
            z-index: 100;
        }

        iframe { width: 100%; height: 100%; border: none; }
        
        .close-bar {
            height: 40px;
            background: #222;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <input type="text" id="pipeInput" placeholder="Search or paste link...">
        <button class="btn" onclick="launchPipe()">LAUNCH</button>
    </div>

    <div id="ghostWindow">
        <div class="close-bar">
            <button onclick="killPipe()" style="color:red; background:none; border:none; font-weight:bold;">✕ CLOSE & CLEAR SESSION</button>
        </div>
        <iframe id="mainPipe" allow="autoplay; fullscreen"></iframe>
    </div>

    <div style="display:flex; height:100%; align-items:center; justify-content:center; color:#333;">
        System Ready...
    </div>

    <script>
        const frame = document.getElementById('mainPipe');
        const win = document.getElementById('ghostWindow');
        const input = document.getElementById('pipeInput');

        function launchPipe() {
            const val = input.value.trim();
            if(!val) return;

            input.blur(); // Drops iPad keyboard instantly

            let finalUrl = "";

            // If it's a YouTube link, we use the NO-COOKIE player with specific flags
            if (val.includes('youtube.com') || val.includes('youtu.be')) {
                let id = val.includes('v=') ? val.split('v=')[1].split('&')[0] : val.split('/').pop();
                // Flag 'origin' tricks the iPad into thinking the video is local
                finalUrl = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&modestbranding=1&rel=0&showinfo=0&origin=${window.location.origin}`;
            } else {
                // If it's a search, we use the Google 'IGU' bypass we found earlier
                finalUrl = `https://www.google.com/search?q=${encodeURIComponent(val)}+video&tbm=vid&igu=1`;
            }

            win.style.display = 'block';
            frame.src = finalUrl;
        }

        function killPipe() {
            frame.src = "about:blank"; // Force the iPad to drop the connection
            win.style.display = 'none';
            input.value = "";
        }

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") launchPipe(); });
    </script>
</body>
</html>
