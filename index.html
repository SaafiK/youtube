<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAFIR_YT_INJECTOR</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid #333; padding: 30px; border-radius: 15px; text-align: center; width: 350px; }
        h2 { color: #00ff88; font-size: 18px; letter-spacing: 2px; }
        input { width: 90%; padding: 12px; margin: 15px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 8px; outline: none; }
        .btn { background: #00ff88; color: #000; padding: 15px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:hover { background: #fff; box-shadow: 0 0 15px #00ff88; }
        .status { margin-top: 10px; font-size: 10px; color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h2>VCISDOE_OPENER</h2>
        <p style="font-size: 12px; color: #888;">Direct Bridge to YTDown Node</p>
        <input type="text" id="ytUrl" placeholder="Paste YouTube Link...">
        <button class="btn" onclick="inject()">LAUNCH_VIDEO</button>
        <div class="status">MODE: BYPASS_INJECTION_ACTIVE</div>
    </div>

    <script>
        function inject() {
            const url = document.getElementById('ytUrl').value.trim();
            if(!url) return alert("Enter a link first!");

            // ytdown uses a search query format. 
            // We encode the URL so the school filter doesn't see 
            // the 'youtube.com' string inside the redirected link.
            const encodedUrl = encodeURIComponent(url);
            const target = `https://app.ytdown.to/search?q=${encodedUrl}`;

            // We use top-level navigation to ensure the site 
            // has full permissions to play the video.
            window.location.href = target;
        }
    </script>
</body>
</html>
