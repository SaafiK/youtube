<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAFIR_YT_OPENER</title>
    <style>
        body { background: #111; color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding: 20px; }
        .app-card { background: #222; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 80%; padding: 15px; border-radius: 10px; border: none; margin-bottom: 20px; font-size: 16px; }
        .btn { background: #ff4500; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

    <div class="app-card">
        <h2>STEALTH_OPENER_V7</h2>
        <p>If embeds are blocked, this uses Search-Proxying.</p>
        <input type="text" id="userInput" placeholder="Paste YouTube Link...">
        <br>
        <button class="btn" onclick="openStealth()">OPEN IN STEALTH_MODE</button>
    </div>

    <script>
        function openStealth() {
            const input = document.getElementById('userInput').value;
            let id = "";
            
            if(input.includes('v=')) id = input.split('v=')[1].split('&')[0];
            else if(input.includes('youtu.be/')) id = input.split('/').pop();
            else id = input;

            if(id.length < 5) return alert("Paste a link first!");

            // METHOD: We send the user to the DuckDuckGo video search 
            // specifically for that video ID. 
            // You can watch the video DIRECTLY in the search results 
            // without ever leaving DuckDuckGo or visiting YouTube.
            const ddgUrl = `https://duckduckgo.com/?q=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D${id}&ia=videos&iax=videos`;
            
            window.location.href = ddgUrl;
        }
    </script>
</body>
</html>
