<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S_BROWSER_ULTIMATE</title>
    <style>
        body { margin: 0; background: #202124; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .chrome-header { background: #dee1e6; padding: 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ccc; }
        .tab { background: #fff; padding: 8px 20px; border-radius: 8px 8px 0 0; font-size: 12px; font-weight: bold; }
        .omnibox { flex-grow: 1; background: #fff; border-radius: 20px; padding: 5px 15px; display: flex; align-items: center; border: 1px solid #dfe1e5; }
        input { border: none; width: 100%; outline: none; font-size: 14px; }
        button { background: #1a73e8; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #viewport { flex-grow: 1; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="chrome-header">
        <div class="tab">New Tab</div>
        <div class="omnibox">
            <input type="text" id="targetUrl" placeholder="Enter URL (e.g., youtube.com)">
        </div>
        <button onclick="launchEmu()">GO</button>
    </div>

    <div id="viewport">
        <iframe id="emuFrame" src="https://www.browserling.com/embed"></iframe>
    </div>

    <script>
        function launchEmu() {
            const val = document.getElementById('targetUrl').value;
            const frame = document.getElementById('emuFrame');
            
            // To avoid the 404, we don't put the URL in the src.
            // We use the "Refined Embed" link which is more stable.
            // If you want to go to a specific site, you have to type it 
            // INSIDE the Browserling screen once it loads.
            
            frame.src = "https://www.browserling.com/browse/win/10/chrome/100/" + encodeURIComponent(val);
            
            // Note: The free version of Browserling has a 3-minute timer.
            // If it asks for money, just clear your browser cookies or use an Incognito tab.
        }
    </script>
</body>
</html>
