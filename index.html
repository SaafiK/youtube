<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Video Portal</title>
    <style>
        :root { --bg: #000; --ui: #1a1a1a; --accent: #39FF14; }
        body, html { background: var(--bg); color: white; margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        
        /* Top Bar */
        .controls {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ui);
            border-bottom: 1px solid #333;
            z-index: 10;
            position: relative;
        }

        input {
            width: 70%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            background: #000;
            color: var(--accent);
            font-size: 16px; /* Critical: 16px prevents iPad auto-zoom */
        }

        .go-btn {
            padding: 12px 20px;
            margin-left: 10px;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Viewport */
        .view {
            height: calc(100% - 80px);
            width: 100%;
            background: #000;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="srch" placeholder="Search Videos..." inputmode="search">
        <button class="go-btn" onclick="launchVideo()">GO</button>
    </div>

    <div class="view">
        <iframe id="portal" src="about:blank" allowfullscreen></iframe>
    </div>

    <script>
        const input = document.getElementById('srch');
        const frame = document.getElementById('portal');

        function launchVideo() {
            const q = input.value.trim();
            if(!q) return;

            // 1. Force keyboard to close (Focus Kill)
            input.blur(); 
            
            // 2. Use Google Video Search (Mobile Version)
            // This bypasses the "Refused to Connect" because it's Google's own search UI
            const target = `https://www.google.com/search?q=${encodeURIComponent(q)}&tbm=vid&igu=1`;
            
            frame.src = target;
        }

        // Search on Enter
        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") launchVideo();
        });
    </script>
</body>
</html>
