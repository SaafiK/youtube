<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S_BROWSER_V9_RAMMERHEAD</title>
    <style>
        body { margin: 0; background: #121212; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; color: #fff; }
        .nav-bar { background: #1e1e1e; padding: 12px; display: flex; gap: 8px; border-bottom: 2px solid #007AFF; }
        select, input { background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; padding: 10px; border-radius: 8px; outline: none; }
        input { flex-grow: 1; font-size: 16px; }
        button { background: #007AFF; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #view { flex-grow: 1; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
        .help { font-size: 10px; color: #666; padding: 5px 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <select id="mirrorSelect">
            <option value="https://demo-opensource.rammerhead.org">MIRROR_A (Official)</option>
            <option value="https://browser.rammerhead.org">MIRROR_B (Pro)</option>
        </select>
        <input type="text" id="targetUrl" placeholder="Enter URL (youtube.com)">
        <button onclick="launch()">BOOT</button>
    </div>

    <div id="view">
        <iframe id="engine" src="about:blank"></iframe>
    </div>

    <div class="help">SYSTEM: RAMMERHEAD_OS // TIMER: NONE // STATUS: READY</div>

    <script>
        function launch() {
            const mirror = document.getElementById('mirrorSelect').value;
            const target = document.getElementById('targetUrl').value.trim();
            const frame = document.getElementById('engine');

            if(!target) return alert("Enter a URL first!");

            // Formats the URL correctly for the Rammerhead engine
            let cleanUrl = target;
            if(!cleanUrl.startsWith('http')) cleanUrl = 'https://' + cleanUrl;

            // This tells the engine to start a fresh, unlimited session
            // Password for most Rammerhead mirrors is: sharkie4life
            frame.src = mirror;
            
            alert("1. When the page loads, click 'Enter Password' if asked.\n2. Password: sharkie4life\n3. Then paste your URL inside their bar.");
        }
    </script>
</body>
</html>
