<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAAFIR_STEALTH_PROXY</title>
    <style>
        :root { --bg: #000; --accent: #39FF14; --panel: #111; }
        body, html { background: var(--bg); color: white; margin: 0; padding: 0; height: 100%; font-family: 'Courier New', monospace; overflow: hidden; }
        
        .header {
            height: 70px;
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--accent);
            gap: 15px;
            padding: 0 20px;
        }

        input {
            flex: 1;
            max-width: 500px;
            padding: 12px;
            background: #000;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 16px; /* Blocks iPad keyboard zoom loop */
            border-radius: 5px;
        }

        .btn {
            padding: 12px 25px;
            background: var(--accent);
            color: black;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .viewport { height: calc(100% - 72px); width: 100%; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .indicator { position: absolute; bottom: 10px; right: 10px; color: var(--accent); font-size: 10px; background: rgba(0,0,0,0.7); padding: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <input type="text" id="proxyUrl" placeholder="Enter Banned URL (e.g. youtube.com/watch?v=...)">
        <button class="btn" onclick="bootProxy()">Boot Proxy</button>
    </div>

    <div class="viewport">
        <iframe id="engine" src="https://www.google.com/search?igu=1"></iframe>
        <div class="indicator">TUNNEL_STATUS: ENCRYPTED</div>
    </div>

    <script>
        const frame = document.getElementById('engine');
        const input = document.getElementById('proxyUrl');

        function bootProxy() {
            let val = input.value.trim();
            if(!val) return;

            // Hide keyboard to prevent iPad focus issues
            input.blur();

            // We use the 'Google Translation' Tunnel. 
            // This is a professional-grade bypass that re-routes traffic through Google's IP.
            // Even if the iPad blocks YouTube, it usually won't block Google Translate.
            let tunnelUrl = `https://translate.google.com/translate?sl=auto&tl=en&u=${encodeURIComponent(val)}`;

            // If it's not a link, use the unblockable Google Mirror
            if (!val.includes('.') || !val.includes('http')) {
                tunnelUrl = `https://www.google.com/search?q=${encodeURIComponent(val)}&igu=1`;
            }

            frame.src = tunnelUrl;
        }

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") bootProxy(); });
    </script>
</body>
</html>
