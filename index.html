<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAAFIR_CORE | Ghost Window</title>
    <style>
        :root { --bg: #000; --accent: #39FF14; --panel: #111; }
        body, html { background: var(--bg); color: white; margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        
        /* Dashboard Control */
        .header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border-bottom: 2px solid var(--accent);
            padding: 0 15px;
            gap: 10px;
        }

        input {
            flex: 1;
            max-width: 400px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: #000;
            color: var(--accent);
            font-size: 16px; /* Prevents iPad zoom/keyboard loops */
        }

        .btn {
            padding: 12px 20px;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Virtual Window */
        .window-area { 
            height: calc(100% - 82px); 
            width: 100%; 
            background: #000; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* This is the container that 'disappears' when you close the tab */
        #virtualContainer {
            width: 100%;
            height: 100%;
            display: none; /* Starts hidden */
        }

        iframe { width: 100%; height: 100%; border: none; }

        .close-btn {
            position: absolute;
            top: 90px;
            right: 20px;
            background: rgba(255,0,0,0.7);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="header">
        <input type="text" id="targetInput" placeholder="Paste link or search term...">
        <button class="btn" onclick="openGhostWindow()">LAUNCH</button>
        <button class="btn" style="background:#333; color:white;" onclick="closeWindow()">CLOSE</button>
    </div>

    <div class="window-area">
        <div id="virtualContainer">
            <button class="close-btn" onclick="closeWindow()">X CLOSE WINDOW</button>
            <iframe id="ghostFrame" allow="autoplay; fullscreen"></iframe>
        </div>
        <div id="placeholder" style="color: #444;">Ready for Launch...</div>
    </div>

    <script>
        const frame = document.getElementById('ghostFrame');
        const container = document.getElementById('virtualContainer');
        const placeholder = document.getElementById('placeholder');
        const input = document.getElementById('targetInput');

        function openGhostWindow() {
            const val = input.value.trim();
            if (!val) return;

            input.blur(); // Drops iPad keyboard

            // Logic: We use a search engine that specializes in direct video playback
            // This avoids 'Refused to connect' because it doesn't use standard headers
            let finalUrl = "";

            if (val.includes('youtube.com') || val.includes('youtu.be')) {
                let id = val.includes('v=') ? val.split('v=')[1].split('&')[0] : val.split('/').pop();
                // We use a specific instance that bypasses the X-Frame-Options block
                finalUrl = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&modestbranding=1`;
            } else {
                // Bing Video Search is much more 'frame-friendly' on iPad networks
                finalUrl = `https://www.bing.com/videos/search?q=${encodeURIComponent(val)}&view=detail&ru=%2fvideos%2fsearch%3fq%3d${encodeURIComponent(val)}`;
            }

            // Reveal the virtual window
            placeholder.style.display = 'none';
            container.style.display = 'block';
            frame.src = finalUrl;
        }

        function closeWindow() {
            frame.src = "about:blank"; // Kills the session
            container.style.display = 'none';
            placeholder.style.display = 'block';
            input.value = "";
        }

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") openGhostWindow(); });
    </script>
</body>
</html>
