<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAFIR_CORE_EXTRACTOR</title>
    <style>
        body { background: #000; color: #fff; font-family: 'SF Pro Display', sans-serif; text-align: center; padding: 20px; }
        .app { max-width: 450px; margin: auto; background: #111; border: 1px solid #00ff88; padding: 25px; border-radius: 20px; }
        input { width: 85%; padding: 15px; background: #000; border: 1px solid #333; color: #00ff88; border-radius: 10px; margin-bottom: 20px; outline: none; font-size: 16px; }
        .fetch-btn { background: #00ff88; color: #000; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 90%; font-size: 16px; }
        #player-zone { display: none; margin-top: 25px; }
        video { width: 100%; border-radius: 12px; background: #000; border: 1px solid #222; }
        .system-menu-btn { display: block; margin-top: 15px; background: #222; color: #00ff88; padding: 12px; border-radius: 8px; text-decoration: none; border: 1px solid #00ff88; font-size: 14px; }
    </style>
</head>
<body>

    <div class="app">
        <h2 style="color:#00ff88; margin-top:0;">INTERNAL_EXTRACTOR</h2>
        <input type="text" id="videoUrl" placeholder="Paste YouTube Link...">
        <button class="fetch-btn" onclick="executeExtraction()">EXTRACT & VIEW</button>

        <div id="player-zone">
            <video id="vPlayer" controls playsinline></video>
            
            <a id="sysLink" class="system-menu-btn" href="#" download="video.mp4">SYSTEM_OPTIONS (VIEW/SAVE)</a>
        </div>
        
        <div id="log" style="margin-top:15px; font-size:10px; color:#444;">ENGINE_READY</div>
    </div>

    <script>
        async function executeExtraction() {
            const input = document.getElementById('videoUrl').value.trim();
            const log = document.getElementById('log');
            const player = document.getElementById('vPlayer');
            const zone = document.getElementById('player-zone');
            const sysLink = document.getElementById('sysLink');

            let id = "";
            if(input.includes('v=')) id = input.split('v=')[1].split('&')[0];
            else if(input.includes('youtu.be/')) id = input.split('/').pop();
            else id = input;

            if(id.length < 5) return alert("Invalid ID");

            log.innerText = "TUNNELING_DATA_STREAM...";

            // We use a different node that is currently up in 2026.
            // This is a direct-to-MP4 link.
            const streamUrl = `https://iv.melmac.space/latest_version?id=${id}&itag=22`;

            // 1. Setup the Internal Player (View on your site)
            player.src = streamUrl;
            
            // 2. Setup the System Menu Link (The iPad popup)
            sysLink.href = streamUrl;

            // 3. Reveal and Play
            zone.style.display = "block";
            
            player.play().then(() => {
                log.innerText = "STREAM_ACTIVE_ON_LOCAL_HOST";
            }).catch(() => {
                log.innerText = "LOCAL_PLAYER_BLOCKED_USE_SYSTEM_OPTIONS";
                // If the player is blocked, the user can still use the System Link
            });
        }
    </script>
</body>
</html>
