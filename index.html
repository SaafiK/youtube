<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAAFIR_YT_BYPASS</title>
    <style>
        :root { --accent: #ff0000; --bg: #0a0a0a; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        
        /* Input UI */
        .nav-ui {
            position: absolute; top: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.8); display: flex; align-items: center;
            justify-content: center; z-index: 100; border-bottom: 1px solid #333;
            transition: transform 0.3s;
        }
        .nav-ui.hidden { transform: translateY(-100%); }

        input {
            width: 60%; padding: 10px 20px; border-radius: 25px;
            border: 1px solid #444; background: #1a1a1a; color: white;
            outline: none; font-size: 14px;
        }
        
        button {
            margin-left: 10px; padding: 10px 20px; border-radius: 25px;
            background: var(--accent); border: none; color: white;
            font-weight: bold; cursor: pointer;
        }

        /* The Player Container */
        #player-container { width: 100vw; height: 100vh; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        .hint { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 10px; color: #666; pointer-events: none; }
    </style>
</head>
<body>

    <div class="nav-ui" id="navbar">
        <input type="text" id="ytLink" placeholder="Paste YouTube Link (or ID) here...">
        <button onclick="loadVideo()">LOAD</button>
    </div>

    <div id="player-container">
        <div style="display:flex; height:100%; align-items:center; justify-content:center; color:#444;">
            READY FOR STREAM_INPUT...
        </div>
    </div>

    <div class="hint">TAP TOP TO SHOW/HIDE INPUT BAR</div>

    <script>
        const navbar = document.getElementById('navbar');
        const input = document.getElementById('ytLink');
        const container = document.getElementById('player-container');

        function loadVideo() {
            let val = input.value.trim();
            if (!val) return;

            // Extract Video ID using Regex (Works for mobile, desktop, and short links)
            let videoId = "";
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = val.match(regex);
            
            if (match && match[1]) {
                videoId = match[1];
            } else if (val.length === 11) {
                videoId = val; // Direct ID entry
            } else {
                alert("Invalid Link. Please paste a full YouTube URL.");
                return;
            }

            // Using the 'youtube-nocookie' mirror which is rarely blocked
            // We also add 'rel=0' to prevent related videos from showing
            container.innerHTML = `<iframe 
                src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen></iframe>`;
            
            navbar.classList.add('hidden');
        }

        // Toggle UI on tap
        document.body.addEventListener('click', (e) => {
            if (e.clientY < 100) {
                navbar.classList.remove('hidden');
            }
        });

        // Enter key support
        input.addEventListener("keypress", (e) => { if (e.key === "Enter") loadVideo(); });
    </script>
</body>
</html>
