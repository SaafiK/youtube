<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAAFIR_CORE v5</title>
    <style>
        :root { --bg: #000; --accent: #39FF14; --panel: #111; }
        body, html { background: var(--bg); color: white; margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        
        .header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border-bottom: 2px solid var(--accent);
            padding: 0 15px;
        }

        .search-wrap { display: flex; width: 100%; max-width: 600px; }
        
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px 0 0 8px;
            border: 1px solid var(--accent);
            background: #000;
            color: var(--accent);
            font-size: 16px; /* Blocks iPad auto-zoom and keyboard loops */
        }

        .btn {
            padding: 12px 20px;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 0 8px 8px 0;
            font-weight: bold;
            cursor: pointer;
        }

        .view-area { height: calc(100% - 82px); width: 100%; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="search-wrap">
            <input type="text" id="term" placeholder="Search for 'Shorts' or a video...">
            <button class="btn" onclick="openInternal()">GO</button>
        </div>
    </div>

    <div class="view-area">
        <iframe id="main" src="about:blank" allowfullscreen></iframe>
    </div>

    <script>
        const frame = document.getElementById('main');
        const input = document.getElementById('term');

        function openInternal() {
            const val = input.value.trim();
            if (!val) return;

            // Step 1: Force keyboard down so it doesn't block the view
            input.blur();

            // Step 2: Use the Google Video Engine
            // The 'vfe' and 'source' parameters trick Google into thinking 
            // it's an internal search, which keeps the video in the frame.
            const googleVideoUrl = `https://www.google.com/search?q=${encodeURIComponent(val)}&tbm=vid&igu=1&ad_e=vfe&source=lnms`;
            
            frame.src = googleVideoUrl;
        }

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") openInternal(); });
    </script>
</body>
</html>
