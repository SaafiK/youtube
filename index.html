<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAAFIR_OS | iPad Core</title>
    <style>
        :root { --bg: #000; --panel: #1a1a1a; --accent: #39FF14; }
        body, html { background: var(--bg); color: white; margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        
        .header {
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border-bottom: 2px solid var(--accent);
            gap: 10px;
        }

        .search-box { display: flex; width: 90%; max-width: 500px; }
        
        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px 0 0 10px;
            border: 1px solid var(--accent);
            background: #000;
            color: var(--accent);
            font-size: 16px; /* Prevents iPad zoom */
        }

        .btn {
            padding: 12px 20px;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 0 10px 10px 0;
            font-weight: bold;
        }

        /* The magic happens here: the frame is hidden until a video is chosen */
        .window-container { height: calc(100% - 100px); width: 100%; position: relative; }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: #000;
        }

        /* Overlay to keep the iPad inside the frame */
        .blocker { position: absolute; top: 0; left: 0; width: 100%; height: 50px; z-index: 5; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 12px; color: var(--accent); font-weight: bold;">[ INTERNAL BROWSER MODE ]</div>
        <div class="search-box">
            <input type="text" id="userInput" placeholder="Search videos or shorts...">
            <button class="btn" onclick="searchInside()">GO</button>
        </div>
    </div>

    <div class="window-container">
        <div class="blocker"></div>
        <iframe id="targetFrame" name="targetFrame" src="about:blank" allowfullscreen></iframe>
    </div>

    <script>
        const frame = document.getElementById('targetFrame');
        const input = document.getElementById('userInput');

        function searchInside() {
            const query = input.value.trim();
            if (!query) return;

            // Blur the input to hide the keyboard instantly
            input.blur();

            // We use the Google Video Tab through an IGU bypass
            // This is the only way to keep the search 'inside' the website on iPad
            const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}&tbm=vid&igu=1`;
            
            // We force the frame to navigate internally
            frame.contentWindow.location.replace(searchUrl);
        }

        // Handle Enter key
        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") searchInside();
        });
    </script>
</body>
</html>
