<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAAFIR_VIRTUAL_EMULATOR</title>
    <style>
        :root { --bg: #000; --accent: #39FF14; --panel: #111; }
        body, html { background: var(--bg); color: white; margin: 0; padding: 0; height: 100%; font-family: monospace; overflow: hidden; }
        
        /* Top Navigation Bar */
        .taskbar {
            height: 60px;
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid var(--accent);
        }

        .search-container { display: flex; flex: 1; justify-content: center; gap: 10px; }
        
        input {
            width: 60%;
            max-width: 500px;
            padding: 10px;
            background: #000;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 5px;
            font-size: 16px; /* Essential for iPad */
        }

        .btn {
            background: var(--accent);
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Virtual Viewport */
        .emulator-body {
            height: calc(100% - 62px);
            width: 100%;
            background: #000;
            position: relative;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Session Overlay */
        .status {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 10px;
            color: var(--accent);
            background: rgba(0,0,0,0.7);
            padding: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="taskbar">
        <div style="color: var(--accent); font-weight: bold;">[V-BROWSER_01]</div>
        <div class="search-container">
            <input type="text" id="target" placeholder="Enter Term or Banned URL...">
            <button class="btn" onclick="boot()">BOOT ENGINE</button>
        </div>
        <button class="btn" style="background:#333; color:white;" onclick="reset()">RESET</button>
    </div>

    <div class="emulator-body">
        <iframe id="engine" allow="autoplay; fullscreen"></iframe>
        <div class="status">VIRTUAL_MACHINE: ACTIVE</div>
    </div>

    <script>
        const frame = document.getElementById('engine');
        const input = document.getElementById('target');

        function boot() {
            const val = input.value.trim();
            if(!val) return;
            input.blur(); // Drops iPad keyboard

            // WE USE ROTATING ENGINES
            // If one is blocked, the 'Emulator' switches to the next one.
            const engines = [
                "https://yewtu.be/search?q=",
                "https://invidious.snopyta.org/search?q=",
                "https://iv.ggtyler.dev/search?q="
            ];
            
            // Randomly select an engine to stay ahead of the iPad filter
            const selectedEngine = engines[Math.floor(Math.random() * engines.length)];
            
            if(val.includes('youtube.com') || val.includes('youtu.be')) {
                let id = val.includes('v=') ? val.split('v=')[1].split('&')[0] : val.split('/').pop();
                frame.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&modestbranding=1&rel=0`;
            } else {
                frame.src = selectedEngine + encodeURIComponent(val);
            }
        }

        function reset() {
            frame.src = "about:blank";
            input.value = "";
        }

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") boot(); });
    </script>
</body>
</html>
