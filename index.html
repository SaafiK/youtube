<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAAFIR_V-OS_CORE</title>
    <style>
        :root { --bg: #000; --accent: #39FF14; --ui: #1a1a1a; }
        body, html { background: var(--bg); color: white; margin: 0; padding: 0; height: 100%; font-family: monospace; overflow: hidden; }
        
        .header {
            height: 60px;
            background: var(--ui);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--accent);
            gap: 10px;
            padding: 0 10px;
        }

        input {
            flex: 1;
            max-width: 400px;
            padding: 10px;
            background: #000;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 16px; /* Critical for iPad keyboard control */
            border-radius: 5px;
        }

        .btn {
            padding: 10px 15px;
            background: var(--accent);
            color: black;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            font-size: 12px;
        }

        .viewport { height: calc(100% - 62px); width: 100%; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <input type="text" id="target" placeholder="Search or Link...">
        <button class="btn" onclick="launch('google')">G-TUNNEL</button>
        <button class="btn" style="background:#00a1f1;" onclick="launch('bing')">B-TUNNEL</button>
    </div>

    <div class="viewport">
        <iframe id="main" src="https://www.google.com/search?igu=1"></iframe>
    </div>

    <script>
        const frame = document.getElementById('main');
        const input = document.getElementById('target');

        function launch(type) {
            const val = input.value.trim();
            if(!val) return;
            input.blur();

            let finalUrl = "";

            if (type === 'google') {
                // The 'Google Translate' Tunnel: Hardest to block on iPads
                finalUrl = `https://translate.google.com/translate?sl=auto&tl=en&u=${encodeURIComponent(val)}`;
                if (!val.includes('http')) {
                    finalUrl = `https://www.google.com/search?q=${encodeURIComponent(val)}&igu=1`;
                }
            } else {
                // The 'Bing Video' Tunnel: Better for 'Refused to connect' issues on computer
                finalUrl = `https://www.bing.com/videos/search?q=${encodeURIComponent(val)}&view=detail`;
            }

            frame.src = finalUrl;
        }

        input.addEventListener("keypress", (e) => { if (e.key === "Enter") launch('google'); });
    </script>
</body>
</html>
